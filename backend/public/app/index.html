<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Typography: Khmer OS Battambang, Khmer OS Muol Light & Calibri Light -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&family=Kantumruy+Pro:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700;800&family=Noto+Serif+Khmer:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Khmer OS Battambang';
      src: local('Khmer OS Battambang'), local('KhmerOSbattambang'), local('Battambang'), url('assets/fonts/KhmerOSbattambang.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Khmer OS Battambang';
      src: local('Khmer OS Battambang Bold'), local('KhmerOSbattambang-Bold'), local('Battambang-Bold'), url('assets/fonts/KhmerOSbattambang-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Khmer OS Muol Light';
      src: local('Khmer OS Muol Light'), local('KhmerOSmuollight'), local('Moul'), local('Khmer OS Muol'), url('assets/fonts/KhmerOSmuollight.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Calibri Light';
      src: local('Calibri Light'), local('Calibri-Light'), local('Segoe UI Light'), local('Calibri');
      font-weight: 300 400;
      font-style: normal;
    }
    :root {
      --font-khmer-heading: 'Khmer OS Muol Light', 'Moul', 'Noto Serif Khmer', 'Calibri Light', sans-serif;
      --font-khmer-body: 'Khmer OS Battambang', 'Battambang', 'Kantumruy Pro', 'Noto Sans Khmer', sans-serif;
      --font-en-heading: 'Calibri Light', 'Segoe UI Light', 'Calibri', sans-serif;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F8FAFC;
      font-family: var(--font-khmer-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1, h2, h3, h4, .khmer-heading {
      font-family: var(--font-khmer-heading);
    }
    .en-heading {
      font-family: var(--font-en-heading);
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bright Light School">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2"/>

  <title>សាលាប្រាយឡាយ • Bright Light School</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
