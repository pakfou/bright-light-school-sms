<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>បង្កើតកាតសម្គាល់ខ្លួន - ID Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Kantumruy Pro', sans-serif; } 
        .id-card { background-image: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen overflow-hidden">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex shadow-xl">
        <div>
            <div class="h-16 flex items-center px-6 bg-slate-950 text-white font-bold text-xl tracking-wide">
                <i class="fa-solid fa-graduation-cap text-blue-500 mr-3 text-2xl"></i> SchoolMS Pro
            </div>
            
            <nav class="p-4 space-y-1.5 text-sm font-medium">
                <a href="index.html" class="flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chart-pie w-6"></i> ផ្ទាំងគ្រប់គ្រងទូទៅ
                </a>
                <a href="attendance.html" class="flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-qrcode w-6 text-emerald-400"></i> ស្កេនវត្តមាន
                </a>
                <a href="students.html" class="flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-user-graduate w-6 text-blue-400"></i> គ្រប់គ្រងសិស្ស
                </a>
                <a href="teachers.html" class="flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chalkboard-user w-6 text-amber-400"></i> គ្រប់គ្រងគ្រូ
                </a>
                <a href="id-cards.html" class="flex items-center px-4 py-3 rounded-xl bg-blue-600 text-white shadow-lg shadow-blue-600/30 transition mt-2">
                    <i class="fa-solid fa-id-card w-6 text-white"></i> បង្កើតកាតសម្គាល់ខ្លួន
                </a>
            </nav>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm">
            <h2 class="text-xl font-bold text-slate-800">បង្កើតកាតសម្គាល់ខ្លួន (ID Cards Generator)</h2>
            <div class="flex items-center space-x-4">
                <button onclick="window.print()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded-xl transition flex items-center">
                    <i class="fa-solid fa-print mr-2"></i> Print Cards
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex gap-4 items-center">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-search"></i></span>
                    <input type="text" id="search-input" placeholder="ស្វែងរកឈ្មោះសិស្ស ដើម្បីបង្កើតកាត..." class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <button class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition">
                    បង្កើតកាត (Generate)
                </button>
            </div>

            <!-- ID Cards Preview Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- ID Card Example 1 -->
                <div class="bg-white rounded-2xl shadow border border-slate-200 overflow-hidden w-[260px] mx-auto h-[400px] flex flex-col relative">
                    <div class="id-card h-32 text-center pt-4 relative">
                        <h3 class="text-white font-bold text-sm tracking-wide">សាលាអន្តរជាតិ SchoolMS</h3>
                        <p class="text-blue-100 text-[10px]">INTERNATIONAL SCHOOL</p>
                        <!-- Profile Image -->
                        <div class="absolute -bottom-10 left-1/2 transform -translate-x-1/2">
                            <img src="https://via.placeholder.com/150" class="w-24 h-24 rounded-full border-4 border-white object-cover shadow-sm">
                        </div>
                    </div>
                    <div class="pt-14 px-4 text-center flex-1 flex flex-col">
                        <h2 class="text-lg font-bold text-slate-800 uppercase">លី ម៉េង</h2>
                        <p class="text-slate-500 text-sm font-medium mb-4">STUDENT</p>
                        
                        <div class="text-left text-xs space-y-1 mt-auto mb-4 bg-slate-50 p-2 rounded-lg">
                            <p><span class="text-slate-500 w-12 inline-block">ID No:</span> <strong class="text-slate-800">STU-10045</strong></p>
                            <p><span class="text-slate-500 w-12 inline-block">DOB:</span> <strong class="text-slate-800">14 Oct 2008</strong></p>
                            <p><span class="text-slate-500 w-12 inline-block">Class:</span> <strong class="text-slate-800">Grade 10A</strong></p>
                        </div>
                        
                        <!-- Barcode/QR -->
                        <div class="mt-auto pb-4">
                            <div class="w-full h-10 bg-slate-200 rounded flex items-center justify-center overflow-hidden">
                                <i class="fa-solid fa-barcode text-3xl text-slate-800 scale-150"></i>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
