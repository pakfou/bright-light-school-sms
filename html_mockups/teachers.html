<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងគ្រូបង្រៀន - Teacher Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: hidden !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-6">
                <button class="text-slate-600 hover:text-blue-600"><i class="fa-solid fa-bars text-xl"></i></button>
                <h1 class="font-bold text-xl text-blue-600">SchoolMS</h1>
            </div>
            <div class="flex items-center space-x-4 overflow-x-auto">
                <a href="students.html" class="px-4 py-2 text-slate-600 hover:text-blue-600 font-medium transition whitespace-nowrap"><i class="fa-solid fa-user-graduate mr-2"></i> បញ្ជីសិស្ស</a>
                <a href="teachers.html" class="px-4 py-2 bg-blue-50 text-blue-600 rounded-lg font-medium transition whitespace-nowrap"><i class="fa-solid fa-chalkboard-user mr-2"></i> បញ្ជីគ្រូបង្រៀន</a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-bold text-slate-900">គ្រប់គ្រងគ្រូបង្រៀន (Teacher Management)</h2>
                <p class="text-sm text-slate-500 mt-1">សរុបគ្រូទាំងអស់: <span id="total-teachers" class="font-semibold text-slate-700">0</span> នាក់</p>
            </div>
            <button onclick="openModal()" class="inline-flex items-center justify-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-lg shadow-blue-600/20 transition transform active:scale-95 w-full md:w-auto">
                <i class="fa-solid fa-plus mr-2"></i> បន្ថែមគ្រូថ្មី / Add Teacher
            </button>
        </div>

        <!-- Filter & Search Bar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="search-input" placeholder="ស្វែងរកតាមឈ្មោះ ឬ កូដ..." class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm transition">
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <select id="filter-status" class="w-full md:w-48 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="all">ទាំងអស់ (All)</option>
                    <option value="active">សកម្ម (Active)</option>
                    <option value="inactive">អសកម្ម (Inactive)</option>
                </select>
                <button onclick="exportCSV()" class="w-full md:w-auto px-4 py-2.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-medium rounded-xl text-sm transition flex items-center justify-center">
                    <i class="fa-solid fa-file-excel mr-2"></i> Export
                </button>
            </div>
        </div>

        <!-- Teacher List (Cards) -->
        <div id="teacher-list" class="space-y-4">
            <div class="text-center p-10 text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i><br>កំពុងទាញយកទិន្នន័យ...</div>
        </div>
    </main>

    <!-- Modal Form (Add/Edit Teacher) -->
    <div id="teacher-modal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900 opacity-50" onclick="closeModal()"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-xl mx-auto rounded-2xl shadow-xl z-50 overflow-y-auto max-h-[90vh]">
            <div class="modal-content py-6 text-left px-6">
                <!-- Title -->
                <div class="flex justify-between items-center pb-4 border-b border-slate-100 mb-5">
                    <p class="text-xl font-bold text-slate-800" id="modal-title">បន្ថែមគ្រូថ្មី</p>
                    <div class="modal-close cursor-pointer z-50 hover:bg-slate-100 p-2 rounded-lg transition" onclick="closeModal()">
                        <i class="fa-solid fa-xmark text-slate-500"></i>
                    </div>
                </div>

                <!-- Form -->
                <form id="teacher-form" class="space-y-4">
                    <input type="hidden" id="teacher-id" value="">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">ឈ្មោះខ្មែរ *</label>
                            <input type="text" id="khmer-name" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">ឈ្មោះឡាតាំង</label>
                            <input type="text" id="english-name" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">លេខទូរស័ព្ទ *</label>
                            <input type="text" id="phone" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">អ៊ីមែល (Email) *</label>
                            <input type="email" id="email" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">មុខវិជ្ជាបង្រៀន</label>
                            <input type="text" id="subject" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="ទូទៅ">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">ថ្ងៃចូលបង្រៀន (Hire Date)</label>
                            <input type="date" id="hire-date" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">តំណភ្ជាប់រូបថត (Photo URL)</label>
                        <input type="url" id="photo-url" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://...">
                    </div>

                    <!-- Footer Buttons -->
                    <div class="flex justify-end pt-4 mt-6 border-t border-slate-100 gap-3">
                        <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition">បោះបង់</button>
                        <button type="submit" id="save-btn" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-lg shadow-blue-600/20 transition flex items-center">
                            <i class="fa-solid fa-save mr-2"></i> រក្សាទុក
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript សម្រាប់មុខងារអន្តរកម្ម (Interactive Functions) & Fetch API -->
    <script>
        const API_URL = 'http://localhost:5000/api/teachers';
        let teachers = [];

        // លោតយកទិន្នន័យពី Backend
        async function fetchTeachers() {
            try {
                const search = document.getElementById('search-input').value;
                const response = await fetch(`${API_URL}?search=${encodeURIComponent(search)}`);
                const result = await response.json();
                
                if (result.success) {
                    teachers = result.data;
                    renderTeachers();
                } else {
                    document.getElementById('teacher-list').innerHTML = `<div class="text-center p-10 text-red-500">បរាជ័យក្នុងការទាញយកទិន្នន័យ</div>`;
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('teacher-list').innerHTML = `<div class="text-center p-10 text-red-500">មិនអាចតភ្ជាប់ទៅកាន់ Server បានទេ</div>`;
            }
        }

        // បង្ហាញទិន្នន័យក្នុង HTML
        function renderTeachers() {
            const listContainer = document.getElementById('teacher-list');
            document.getElementById('total-teachers').innerText = teachers.length;
            listContainer.innerHTML = '';

            if (teachers.length === 0) {
                listContainer.innerHTML = `<div class="text-center p-10 text-slate-500 bg-white rounded-2xl border border-slate-200">គ្មានទិន្នន័យគ្រូបង្រៀនឡើយ</div>`;
                return;
            }

            teachers.forEach(t => {
                const initial = (t.name_kh || t.name_en || 'T').charAt(0).toUpperCase();
                const photoHtml = (t.photo_url && t.photo_url.startsWith('http')) 
                    ? `<img src="${t.photo_url}" class="w-12 h-12 rounded-xl object-cover" onerror="this.outerHTML='<div class=\\'w-12 h-12 bg-blue-100 text-blue-600 font-bold rounded-xl flex items-center justify-center text-lg\\'>${initial}</div>'"/>` 
                    : `<div class="w-12 h-12 bg-blue-100 text-blue-600 font-bold rounded-xl flex items-center justify-center text-lg">${initial}</div>`;

                const card = `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex items-center space-x-4">
                        ${photoHtml}
                        <div>
                            <h3 class="font-bold text-slate-900 text-lg">${t.name_kh || ''} ${t.name_en ? `(${t.name_en})` : ''} <span class="text-xs font-normal px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full ml-2">ID: ${t.teacher_code}</span></h3>
                            <div class="text-sm text-slate-500 mt-1 flex flex-wrap gap-x-4 gap-y-1">
                                <span><i class="fa-solid fa-envelope text-slate-400 mr-1"></i> ${t.email}</span>
                                <span><i class="fa-solid fa-book text-slate-400 mr-1"></i> មុខវិជ្ជា: ${t.subject || 'ទូទៅ'}</span>
                                <span><i class="fa-solid fa-phone text-slate-400 mr-1"></i> ${t.phone || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 self-end sm:self-center">
                        <button onclick="editTeacher(${t.id})" class="w-10 h-10 flex items-center justify-center text-amber-500 hover:bg-amber-50 rounded-xl transition" title="កែប្រែ"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteTeacher(${t.id})" class="w-10 h-10 flex items-center justify-center text-rose-500 hover:bg-rose-50 rounded-xl transition" title="លុប"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
                listContainer.insertAdjacentHTML('beforeend', card);
            });
        }

        // បើក/បិទ Modal
        function openModal(isEdit = false) {
            const modal = document.getElementById('teacher-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
            if (!isEdit) {
                document.getElementById('modal-title').innerText = "បន្ថែមគ្រូថ្មី";
                document.getElementById('teacher-form').reset();
                document.getElementById('teacher-id').value = '';
                document.getElementById('hire-date').value = new Date().toISOString().split('T')[0];
            }
        }

        function closeModal() {
            const modal = document.getElementById('teacher-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        // កែប្រែ
        function editTeacher(id) {
            const teacher = teachers.find(t => t.id === id);
            if (!teacher) return;
            
            document.getElementById('modal-title').innerText = "កែប្រែព័ត៌មានគ្រូ";
            document.getElementById('teacher-id').value = teacher.id;
            document.getElementById('khmer-name').value = teacher.name_kh || '';
            document.getElementById('english-name').value = teacher.name_en || '';
            document.getElementById('email').value = teacher.email || '';
            document.getElementById('phone').value = teacher.phone || '';
            document.getElementById('subject').value = teacher.subject || 'ទូទៅ';
            document.getElementById('photo-url').value = teacher.photo_url || '';
            document.getElementById('hire-date').value = teacher.hire_date ? teacher.hire_date.split('T')[0] : '';
            
            openModal(true);
        }

        // លុប
        async function deleteTeacher(id) {
            if(confirm("តើអ្នកពិតជាចង់លុបទិន្នន័យនេះមែនទេ?")) {
                try {
                    const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    const result = await response.json();
                    if(result.success) {
                        alert("បានលុបដោយជោគជ័យ!");
                        fetchTeachers();
                    } else {
                        alert("បរាជ័យក្នុងការលុប: " + result.error);
                    }
                } catch(err) {
                    alert("មានបញ្ហាប្រព័ន្ធ (Network Error)");
                }
            }
        }

        // រក្សាទុក (Save - Create / Update)
        document.getElementById('teacher-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('teacher-id').value;
            const data = {
                name_kh: document.getElementById('khmer-name').value,
                name_en: document.getElementById('english-name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                subject: document.getElementById('subject').value,
                photo_url: document.getElementById('photo-url').value,
                hire_date: document.getElementById('hire-date').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if(result.success) {
                    alert(id ? "កែប្រែទិន្នន័យជោគជ័យ!" : "បានបន្ថែមគ្រូថ្មីជោគជ័យ!");
                    closeModal();
                    fetchTeachers();
                } else {
                    alert("បរាជ័យ: " + (result.error || "មិនស្គាល់"));
                }
            } catch(error) {
                alert("មានបញ្ហាប្រព័ន្ធ (Network Error)");
            }
        });

        // ដំណើរការពេលបើកទំព័រ
        document.addEventListener('DOMContentLoaded', () => {
            fetchTeachers();
            
            // ស្វែងរក
            let searchTimeout;
            document.getElementById('search-input').addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(fetchTeachers, 500);
            });
        });

        function exportCSV() {
            if(teachers.length === 0) return alert("គ្មានទិន្នន័យដើម្បី Export ទេ");
            let csv = '\uFEFFកូដគ្រូ,ឈ្មោះខ្មែរ,ឈ្មោះឡាតាំង,មុខវិជ្ជា,អ៊ីមែល,ទូរស័ព្ទ\n';
            teachers.forEach(t => {
                csv += `"${t.teacher_code}","${t.name_kh}","${t.name_en}","${t.subject}","${t.email}","${t.phone}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'teachers_list.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
