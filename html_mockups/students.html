<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងសិស្ស - Student Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kantumruy Pro', sans-serif; } .modal { transition: opacity 0.25s ease; } body.modal-active { overflow: hidden; } </style>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen overflow-hidden">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex shadow-xl">
        <div>
            <!-- Logo Brand -->
            <div class="h-16 flex items-center px-6 bg-slate-950 text-white font-bold text-xl tracking-wide">
                <i class="fa-solid fa-graduation-cap text-blue-500 mr-3 text-2xl"></i> SchoolMS Pro
            </div>
            
            <!-- Menu Links -->
            <nav class="p-4 space-y-1.5 text-sm font-medium">
                <a href="index.html" class="flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chart-pie w-6"></i> ផ្ទាំងគ្រប់គ្រងទូទៅ
                </a>
                <a href="attendance.html" class="flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-qrcode w-6 text-emerald-400"></i> ស្កេនវត្តមាន
                </a>
                <a href="students.html" class="flex items-center px-4 py-3 rounded-xl bg-blue-600 text-white shadow-lg shadow-blue-600/30 transition">
                    <i class="fa-solid fa-user-graduate w-6 text-white"></i> គ្រប់គ្រងសិស្ស
                </a>
                <a href="teachers.html" class="flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chalkboard-user w-6 text-amber-400"></i> គ្រប់គ្រងគ្រូ
                </a>
                <a href="classes.html" class="flex items-center px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-school w-6 text-indigo-400"></i> គ្រប់គ្រងថ្នាក់រៀន
                </a>
                <!-- Other links shortened for brevity -->
            </nav>
        </div>
        <div class="p-4 bg-slate-950 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center font-bold justify-center text-white">AD</div>
                <div>
                    <p class="text-sm font-bold text-white">Admin System</p>
                    <p class="text-xs text-slate-400">superadmin@school.com</p>
                </div>
            </div>
            <button class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-right-from-bracket text-lg"></i></button>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm">
            <h2 class="text-xl font-bold text-slate-800">គ្រប់គ្រងសិស្ស (Student Management)</h2>
            <div class="flex items-center space-x-4">
                <button onclick="openModal()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-lg shadow-blue-600/20 transition flex items-center">
                    <i class="fa-solid fa-plus mr-2"></i> បន្ថែមសិស្សថ្មី
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8">
            <!-- Filter & Search -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="relative w-full md:w-96">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"><i class="fa-solid fa-search"></i></span>
                    <input type="text" id="search-input" placeholder="ស្វែងរកតាមឈ្មោះ, អត្តលេខ..." class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
            </div>

            <!-- Student Table -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-sm text-slate-600">
                            <th class="py-4 px-6 font-semibold">អត្តលេខ</th>
                            <th class="py-4 px-6 font-semibold">ឈ្មោះសិស្ស</th>
                            <th class="py-4 px-6 font-semibold">ភេទ</th>
                            <th class="py-4 px-6 font-semibold">ថ្នាក់រៀន</th>
                            <th class="py-4 px-6 font-semibold">ទូរស័ព្ទអាណាព្យាបាល</th>
                            <th class="py-4 px-6 font-semibold text-center">សកម្មភាព</th>
                        </tr>
                    </thead>
                    <tbody id="student-list" class="divide-y divide-slate-100">
                        <tr><td colspan="6" class="py-10 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i> កំពុងទាញយកទិន្នន័យ...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ADD/EDIT MODAL -->
    <div id="student-modal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900 opacity-50" onclick="closeModal()"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-2xl mx-auto rounded-2xl shadow-xl z-50 overflow-y-auto max-h-[90vh]">
            <div class="modal-content py-6 px-6">
                <div class="flex justify-between items-center pb-4 border-b border-slate-100 mb-5">
                    <p class="text-xl font-bold text-slate-800" id="modal-title">បន្ថែមសិស្សថ្មី</p>
                    <div class="cursor-pointer hover:bg-slate-100 p-2 rounded-lg" onclick="closeModal()"><i class="fa-solid fa-xmark text-slate-500"></i></div>
                </div>
                <form id="student-form" class="space-y-4">
                    <input type="hidden" id="student-id" value="">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-sm mb-1 text-slate-700">អត្តលេខសិស្ស</label><input type="text" id="s-code" class="w-full px-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                        <div><label class="block text-sm mb-1 text-slate-700">ថ្នាក់រៀន ID</label><input type="text" id="s-class" class="w-full px-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-sm mb-1 text-slate-700">ឈ្មោះខ្មែរ *</label><input type="text" id="s-name" required class="w-full px-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                        <div><label class="block text-sm mb-1 text-slate-700">ឈ្មោះឡាតាំង</label><input type="text" id="s-name-en" class="w-full px-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm mb-1 text-slate-700">ភេទ *</label>
                            <select id="s-gender" class="w-full px-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500">
                                <option value="Female">ស្រី</option>
                                <option value="Male">ប្រុស</option>
                            </select>
                        </div>
                        <div><label class="block text-sm mb-1 text-slate-700">ថ្ងៃខែឆ្នាំកំណើត</label><input type="date" id="s-dob" class="w-full px-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-sm mb-1 text-slate-700">ឈ្មោះអាណាព្យាបាល</label><input type="text" id="s-parent" class="w-full px-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                        <div><label class="block text-sm mb-1 text-slate-700">លេខទូរស័ព្ទអាណាព្យាបាល</label><input type="text" id="s-phone" class="w-full px-4 py-2 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-blue-500"></div>
                    </div>
                    <div class="flex justify-end pt-4 mt-6 border-t border-slate-100 gap-3">
                        <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl transition">បោះបង់</button>
                        <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-lg transition">រក្សាទុក</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/students';
        let studentsList = [];

        async function fetchStudents() {
            try {
                const search = document.getElementById('search-input').value;
                const res = await fetch(`${API_URL}?search=${encodeURIComponent(search)}`);
                const data = await res.json();
                if(data.success) {
                    studentsList = data.data;
                    renderStudents();
                }
            } catch(e) {
                console.error(e);
            }
        }

        function renderStudents() {
            const tbody = document.getElementById('student-list');
            if(studentsList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-10 text-center text-slate-500">គ្មានទិន្នន័យឡើយ</td></tr>`;
                return;
            }
            tbody.innerHTML = studentsList.map(s => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-4 px-6 font-medium text-slate-900">${s.student_code || 'N/A'}</td>
                    <td class="py-4 px-6 text-slate-800">
                        <div class="font-bold">${s.name_kh}</div>
                        <div class="text-xs text-slate-500">${s.name_en || ''}</div>
                    </td>
                    <td class="py-4 px-6 text-slate-600">${s.gender == 'Female' ? 'ស្រី' : 'ប្រុស'}</td>
                    <td class="py-4 px-6 text-slate-600">${s.class_name || 'ទូទៅ'}</td>
                    <td class="py-4 px-6 text-slate-600">${s.parent_phone || 'N/A'}</td>
                    <td class="py-4 px-6 text-center">
                        <button onclick="editStudent(${s.id})" class="w-8 h-8 text-amber-500 hover:bg-amber-50 rounded-lg"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteStudent(${s.id})" class="w-8 h-8 text-rose-500 hover:bg-rose-50 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(isEdit = false) {
            document.getElementById('student-modal').classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
            if(!isEdit) {
                document.getElementById('modal-title').innerText = "បន្ថែមសិស្សថ្មី";
                document.getElementById('student-form').reset();
                document.getElementById('student-id').value = '';
            }
        }

        function closeModal() {
            document.getElementById('student-modal').classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        function editStudent(id) {
            const s = studentsList.find(x => x.id === id);
            if(!s) return;
            document.getElementById('modal-title').innerText = "កែប្រែព័ត៌មានសិស្ស";
            document.getElementById('student-id').value = s.id;
            document.getElementById('s-code').value = s.student_code || '';
            document.getElementById('s-name').value = s.name_kh || '';
            document.getElementById('s-name-en').value = s.name_en || '';
            document.getElementById('s-gender').value = s.gender || 'Female';
            document.getElementById('s-dob').value = s.dob ? s.dob.split('T')[0] : '';
            document.getElementById('s-parent').value = s.parent_name || '';
            document.getElementById('s-phone').value = s.parent_phone || '';
            document.getElementById('s-class').value = s.classroom_id || '';
            openModal(true);
        }

        async function deleteStudent(id) {
            if(!confirm("តើអ្នកចង់លុបទិន្នន័យនេះមែនទេ?")) return;
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchStudents();
        }

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('student-id').value;
            const data = {
                student_code: document.getElementById('s-code').value,
                name_kh: document.getElementById('s-name').value,
                name_en: document.getElementById('s-name-en').value,
                gender: document.getElementById('s-gender').value,
                dob: document.getElementById('s-dob').value,
                parent_name: document.getElementById('s-parent').value,
                parent_phone: document.getElementById('s-phone').value,
                classroom_id: document.getElementById('s-class').value || null
            };
            
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;
            
            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            closeModal();
            fetchStudents();
        });

        document.addEventListener('DOMContentLoaded', () => {
            fetchStudents();
            document.getElementById('search-input').addEventListener('input', () => {
                setTimeout(fetchStudents, 500);
            });
        });
    </script>
</body>
</html>
